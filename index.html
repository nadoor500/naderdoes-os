  return `<h1 class="ph">${esc(label(d))}</h1><div class="card"><div class="mini"><div><b>${rows.length}</b><span>Posts</span></div><div><b>${fmt(tv)}</b><span>Views</span></div><div><b>${fmt(tr)}</b><span>Reach</span></div></div></div>
   <div class="stack" style="margin-top:10px">${rows.map(p=>{const k=KNOWN[p.date+"|"+p.views];const x=p.views/MED;const pl=(k&&k.b.pillar)||p.b.pillar;
     return `<div class="card post${plAttr(pl)}"><div class="top"><div style="min-width:0">${ptop(pl)}<div class="t1">${k?esc(cap(k.title)):"Post"}</div><div class="t2">${k?esc(k.type):"Title shows once the full data is live"}</div></div><div class="views"><b>${fmt(p.views)}</b><span class="x" style="color:${x>=2?"var(--good)":"var(--ink-soft)"}">${x>=100?fmt(x):x.toFixed(1)}x median</span></div></div><div class="bar"><i style="width:${Math.min(100,x/3*100)}%"></i></div>${k&&k.b.link?`<div class="actions" style="margin-top:2px"><a class="ext" href="${esc(k.b.link)}" target="_blank" rel="noopener">Watch on Instagram ${arrow}</a></div>`:""}</div>`}).join("")}</div>`}
function audPanel(){return `<h1 class="ph">Audience breakdown</h1><div class="card" id="agebox">${ageBox()}</div><div class="card" id="audbox" style="margin-top:10px">${audBox()}</div>`}
function panelView(id){const back=`<button class="back" data-back>‹ Back</button>`;let b="";
  if(id.startsWith("traj"))b=trajPanel();else if(id==="split")b=splitPanel();else if(id==="cal")b=calP();else if(id==="aud")b=audPanel();else if(id.startsWith("day:"))b=dayPanel(+id.slice(4));
  return back+b}

/* ---------- render + bind ---------- */
function render(){const v=$("#view");v.innerHTML=sub?panelView(sub):home();$("#tail").hidden=!!sub;bind()}
function bindTiles(){document.querySelectorAll(".pt").forEach(el=>{const t=()=>{const o=el.classList.toggle("open");el.setAttribute("aria-expanded",o)};el.onclick=e=>{if(e.target.closest("a"))return;t()};el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}}})}
function bindAud(){const ab=$("#audbox"),gb=$("#agebox");if(!ab)return;
  const pick=c=>{selC=selC===c?"":c;ab.innerHTML=audBox();bindAud()};
  ab.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>pick(b.dataset.ct));
  ab.querySelectorAll(".ct.on[data-c]").forEach(p=>p.addEventListener("click",()=>pick(p.dataset.c)));
  gb.querySelectorAll("[data-agw]").forEach(b=>b.onclick=()=>{AGW=b.dataset.agw;gb.innerHTML=ageBox();bindAud()})}
function bind(){
  document.querySelectorAll("[data-panel]").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("a"))return;sub=el.dataset.panel;hideTip();render();window.scrollTo(0,0)}));
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{sub=sub&&sub.startsWith("day:")?"cal":null;render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-join]").forEach(b=>b.onclick=()=>{const j=$("#join");if(j)j.scrollIntoView({behavior:"smooth",block:"start"})});
  document.querySelectorAll("[data-tw]").forEach(b=>b.onclick=()=>{topWin=b.dataset.tw;document.querySelectorAll("[data-tw]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#toplist").innerHTML=(topWin==="all"?TOPALL:TOP30).slice(0,3).map(tile).join("");bindTiles()});
  bindTiles();bindAud();
  document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{TM=b.dataset.tm;render()});
  document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{TR=b.dataset.tr;render()});
  document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{SPLITD=+b.dataset.sd;render()});
  document.querySelectorAll("svg.lc").forEach(svg=>{const c=CH[svg.dataset.ch];if(!c)return;const gl=svg.querySelector(".guide"),gd=svg.querySelector(".gdot");
    const mv=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*c.W;let best=c.pts[0];c.pts.forEach(p=>{if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p});
      gl.setAttribute("x1",best.x);gl.setAttribute("x2",best.x);gl.setAttribute("opacity",".5");gd.setAttribute("cx",best.x);gd.setAttribute("cy",best.y);gd.setAttribute("opacity","1");
      showTip(best.lbl,r.left+best.x/c.W*r.width,r.top+best.y/(svg.viewBox.baseVal.height)*r.height)};
    svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);svg.addEventListener("pointerleave",()=>{gl.setAttribute("opacity","0");gd.setAttribute("opacity","0");hideTip()})});
}
$("#themeBtn").onclick=()=>{themePref={auto:"light",light:"dark",dark:"auto"}[themePref]||"auto";try{localStorage.setItem("ndos-pub-theme",themePref)}catch(e){}applyTheme();render()};
applyTheme();setInterval(applyTheme,300000);

/* ---------- header, coach, waitlist ---------- */
function paint(){const p=String(META.synced||"").split(" ");const last=new Date(S.today-DAYMS);
  $("#hdrDate").textContent="Data to "+last.getDate()+" "+MON[last.getMonth()]+(p[1]?" · updated "+p[1]:"");
  const c=(META.coach||[]).filter(Boolean);$("#coach").innerHTML=c.length?c.map(x=>`<div style="font-family:var(--serif);font-size:21px;line-height:1.3;margin:0 0 8px">${esc(x)}</div>`).join(""):`<div class="muted">My coach leaves a note here after each weekly review. The first one lands soon.</div>`;
  $("#count").textContent=META.waitlist>=5?"You would be #"+(META.waitlist+1)+" to sign up.":"Be one of the first."}
let role="";
document.querySelectorAll("#wl .fchips button").forEach(c=>c.addEventListener("click",()=>{const on=c.getAttribute("aria-pressed")==="true";document.querySelectorAll("#wl .fchips button").forEach(x=>x.setAttribute("aria-pressed","false"));role=on?"":c.dataset.v;if(!on)c.setAttribute("aria-pressed","true")}));
$("#wl").addEventListener("submit",e=>{e.preventDefault();const em=$("#f-email").value.trim(),er=$("#err");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){er.textContent="That email looks off. Check it and try again.";er.hidden=false;return}
  er.hidden=true;$("#go").disabled=true;
  const body=JSON.stringify({email:em,name:$("#f-name").value.trim(),ig:$("#f-ig").value.trim(),role:role,at:new Date().toISOString()});
  const done=()=>{$("#wl").innerHTML='<div class="ok">You\'re in. I\'ll be in touch.</div>'};
  if(!ENDPOINT){setTimeout(done,350);return}
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:body}).then(done).catch(()=>{er.textContent="That did not go through. Try again in a minute.";er.hidden=false;$("#go").disabled=false})});
async function init(){
  $("#view").innerHTML='<div class="card muted" style="margin-top:14px">Loading the numbers…</div>';$("#tail").hidden=true;
  let d=null;
  try{const tm=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),7000));
    const get=g=>fetch(PUB+GID[g]).then(x=>{if(!x.ok)throw new Error(g);return x.text()});
    const [a,b,c]=await Promise.race([Promise.all([get("pub"),get("meta"),get("aud")]),tm]);d=fromLive(a,b,c)}catch(e){d=null}
  commit(d||fromSnap());paint();sub=null;render()}
init();
})();
</script>
</body></html>
